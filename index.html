<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神秘消息</title>
    <style>
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
        }
        
        .modal-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }

        /* 晃动动画 */
        @keyframes shake {
            0%,100% {transform: translate(-50%, -50%) rotate(0deg);}
            25% {transform: translate(-50%, -50%) rotate(2deg);}
            50% {transform: translate(-50%, -50%) rotate(-2deg);}
            75% {transform: translate(-50%, -50%) rotate(2deg);}
        }
        .shake {
            animation: shake 0.4s;
        }

        /* 按钮样式 */
        .btn {
            margin: 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .confirm {
            background: #07c160;
            color: white;
        }
        .cancel {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 第一个弹窗 -->
    <div id="firstModal" class="modal" style="display: block;">
        <div class="modal-box">
            <h3>你是周哈吗？</h3>
            <button class="btn confirm" onclick="handleConfirm()">是</button>
            <button class="btn cancel" onclick="handleCancel()">否</button>
        </div>
    </div>

    <!-- 第二个弹窗 -->
    <div id="secondModal" class="modal">
        <div class="modal-box">
            <h3>哈哈哈</h3>
            <button class="btn confirm" onclick="closeAll()">好的</button>
        </div>
    </div>

    <script>
        // 禁止页面滚动
        document.body.style.overflow = 'hidden';
        
        // 禁用返回按钮
        history.pushState(null, null, document.URL);
        window.addEventListener('popstate', function() {
            history.pushState(null, null, document.URL);
        });

        function handleConfirm() {
            document.getElementById('firstModal').style.display = 'none';
            document.getElementById('secondModal').style.display = 'block';
        }

        function handleCancel() {
            // 添加晃动效果
            const box = document.querySelector('#firstModal .modal-box');
            box.classList.add('shake');
            setTimeout(() => box.classList.remove('shake'), 400);
        }

        function closeAll() {
            document.getElementById('secondModal').style.display = 'none';
            // 恢复页面滚动
            document.body.style.overflow = 'auto';
        }

        // 防止点击蒙层关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) e.stopPropagation();
            });
        });
    </script>
</body>
</html>
